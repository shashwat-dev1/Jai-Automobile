# DSA OS — Alembic Configuration
# This file configures Alembic for async SQLAlchemy migrations.
# Migrations run as dsaos_migrator (table owner), NOT dsaos_app.

[alembic]
# Script location is relative to the backend/ directory
script_location = migrations
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 50
timezone = UTC

# SQLAlchemy URL for migrations (dsaos_migrator role)
# Overridden programmatically in migrations/env.py from DATABASE_MIGRATION_URL
sqlalchemy.url = postgresql+asyncpg://dsaos_migrator:dev_password@localhost:5432/dsaos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
