# =============================================================================
# DSA OS — Docker Compose (Development)
# Versions pinned per ADR-006-toolchain-versions.md
# =============================================================================

name: dsaos

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dsaos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsaos
      POSTGRES_USER: dsaos_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pg_password_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsaos_migrator -d dsaos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dsaos-net

  # ---------------------------------------------------------------------------
  # Redis 7.2
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: dsaos-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-dev_redis_password_change_me}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dsaos-net

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # Pinned release per ADR-006
  # ---------------------------------------------------------------------------
  minio:
    image: elestio/minio:latest
    container_name: dsaos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dev_minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dev_minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - dsaos-net

  # ---------------------------------------------------------------------------
  # ClamAV — Malware scanning daemon
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:latest
    container_name: dsaos-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - dsaos-net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: dsaos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-dsaos_app}:${POSTGRES_APP_PASSWORD:-dev_app_pg_password_change_me}@postgres:5432/${POSTGRES_DB:-dsaos}
      DATABASE_MIGRATION_URL: postgresql+asyncpg://${POSTGRES_USER:-dsaos_migrator}:${POSTGRES_PASSWORD:-dev_pg_password_change_me}@postgres:5432/${POSTGRES_DB:-dsaos}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CLAMAV_HOST: clamav
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/keys:/app/keys:ro
    networks:
      - dsaos-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---------------------------------------------------------------------------
  # Worker — ARQ background job processor
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: dsaos-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-dsaos_app}:${POSTGRES_APP_PASSWORD:-dev_app_pg_password_change_me}@postgres:5432/${POSTGRES_DB:-dsaos}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_redis_password_change_me}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CLAMAV_HOST: clamav
    volumes:
      - ./backend:/app
      - ./backend/keys:/app/keys:ro
    networks:
      - dsaos-net
    command: python -m arq app.workers.tasks.WorkerSettings

  # ---------------------------------------------------------------------------
  # Frontend — Vite React TypeScript
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: dsaos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_BACKEND_PROXY_TARGET=http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dsaos-net
    command: npm run dev -- --host

# ---------------------------------------------------------------------------
# Named volumes — persistent data
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  clamav-db:
    driver: local

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  dsaos-net:
    driver: bridge
